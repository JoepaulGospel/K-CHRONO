<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>K-CHRONO | The Infrastructure</title>
<!-- APPLE / IOS SPECIFIC -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="K-CHRONO">
<link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/FFFFFF/flower-main.png">
<!-- ANDROID / WEBAPP -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=DM+Serif+Display:italic&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --kb-red: #ef4444; --kb-blue: #2563eb; }
body {
background-color: #000000;
color: #FFFFFF;
font-family: 'Inter', sans-serif;
overflow: hidden;
height: 100vh;
margin: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
padding: 40px 0 60px 0; /* Extra padding for iOS bottom bars */
transition: background 0.4s ease;
}
.font-serif { font-family: 'DM Serif Display', serif; }
.font-mono { font-family: 'JetBrains Mono', monospace; }
.dot-grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 10px; justify-items: center; align-items: center; }
@media (min-width: 768px) { .dot-grid { grid-template-columns: repeat(25, 1fr); gap: 12px; } }
.dot { width: 6px; height: 6px; border-radius: 50%; transition: all 0.3s ease; cursor: pointer; position: relative; }
.dot-past { background-color: var(--kb-red); box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
.dot-today { background-color: var(--kb-blue) !important; box-shadow: 0 0 15px var(--kb-blue); animation: pulse 2s infinite; z-index: 10; }
.dot-future { background-color: #1a1a1a; }
.garden-empty { background-color: #333333; opacity: 0.5; }
.flower-ink { width: 22px; height: 22px; fill: none; stroke-width: 2; stroke-linecap: round; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0.8; } }
.immersive-page { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: all 0.4s ease; }
.immersive-page.active { opacity: 1; pointer-events: auto; }
.paper-textarea { width: 100%; max-width: 400px; background: transparent; border: none; outline: none; font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; text-align: center; resize: none; color: white; }
.theme-pie { position: fixed; top: 80px; right: 20px; display: grid; gap: 12px; opacity: 0; pointer-events: none; transition: 0.4s; z-index: 150; }
.theme-pie.active { opacity: 1; pointer-events: auto; }
.theme-dot { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); cursor: pointer; }
.glass-nav { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); }
.hide { display: none !important; }
</style>
</head>
<body id="main-body">
<!-- THEME SELECTION -->
<button onclick="toggleThemePie()" class="fixed top-12 right-6 z-[160] p-2 opacity-30 hover:opacity-100">
<i data-lucide="palette" id="main-palette-icon" class="w-7 h-7"></i>
</button>
<div id="theme-pie" class="theme-pie">
<div onclick="applyGlobalTheme('#000000')" class="theme-dot bg-black"></div>
<div onclick="applyGlobalTheme('#1e3a8a')" class="theme-dot bg-blue-900"></div>
<div onclick="applyGlobalTheme('#064e3b')" class="theme-dot bg-green-900"></div>
</div>
<header class="w-full text-center px-6">
<h1 id="top-title" class="text-3xl font-serif italic text-white">2026</h1>
<p id="top-subtitle" class="text-[8px] font-black uppercase tracking-[0.5em] opacity-30 mt-2">K-CHRONO</p>
</header>
<div class="flex-1 flex items-center justify-center w-full px-5 overflow-hidden">
<div id="chrono-view" class="w-full flex justify-center"><div id="chrono-grid" class="dot-grid"></div></div>
<div id="garden-view" class="w-full hide flex justify-center"><div id="garden-grid" class="dot-grid"></div></div>
</div>
<footer class="w-full flex flex-col items-center gap-10 pb-24">
<div id="chrono-stats" class="flex flex-col items-center gap-2">
<div class="flex gap-4 text-[9px] font-black uppercase tracking-[0.2em] opacity-50 italic">
<span id="days-left-text">---D LEFT</span>
<span>/</span>
<span id="percent-text" class="font-mono">0.000000%</span>
</div>
</div>
</footer>
<nav class="fixed bottom-10 glass-nav p-1.5 rounded-full flex gap-1 shadow-2xl z-[50]">
<button onclick="switchView('chrono')" id="btn-chrono" class="px-8 py-3 rounded-full bg-white text-black"><i data-lucide="clock" class="w-5 h-5"></i></button>
<button onclick="switchView('garden')" id="btn-garden" class="px-8 py-3 rounded-full text-white/30"><i data-lucide="flower" class="w-5 h-5"></i></button>
</nav>
<div id="immersive-overlay" class="immersive-page px-10" onclick="closeOverlay()">
<div id="overlay-content" class="w-full h-full flex flex-col items-center justify-center gap-14"></div>
</div>
<script>
// --- PWA / IOS LOGIC ---
if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('sw.js');
}
// Logic to check if user is on iOS and NOT installed
const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
if (isIos && !isStandalone) {
// Optional: You could show a small "Tap Share -> Add to Home Screen" message here
console.log("iOS detected: Suggesting manual install via Safari Share menu.");
}
// --- APP CODE ---
const FLOWER_PATHS = [
`<path d="M12 22c0-4 3-7 3-10S12 2 12 2s-3 7-3 10 3 6 3 10M7 12c0 2 2 4 5 4s5-2 5-4-2-4-5-4-5 2-5 4z"/>`,
`<path d="M12 22V12M12 12c2-2 4-2 4-4s-2-2-4 0M12 12c-2-2-4-2-4-4s2-2 4 0"/>`,
`<path d="M12 7c2.5-4.5 9-3 9 2s-6.5 6.5-9 11c-2.5-4.5-9-6-9-11s6.5-6.5 9-2z"/>`
];
const ORIGINAL_QUOTES = ["Time is limited.", "Focus on the present.", "Excellence is a habit.", "Luck is preparation."];
let memories = JSON.parse(localStorage.getItem('kchrono_memories')) || {};
let chronoBG = localStorage.getItem('kchrono_bg') || '#000000';
let activeView = 'chrono';
function init() {
applyGlobalTheme(chronoBG, true);
updateTicker(); updateChronoGrid();
lucide.createIcons();
}
function toggleThemePie() { document.getElementById('theme-pie').classList.toggle('active'); }
function applyGlobalTheme(color, isInit = false) {
document.getElementById('main-body').style.backgroundColor = color;
if (!isInit) { chronoBG = color; localStorage.setItem('kchrono_bg', color); toggleThemePie(); }
if (activeView === 'garden') renderGarden(); else updateChronoGrid();
}
function switchView(view) {
activeView = view;
const isChrono = view === 'chrono';
document.getElementById('chrono-view').classList.toggle('hide', !isChrono);
document.getElementById('garden-view').classList.toggle('hide', isChrono);
const btnC = document.getElementById('btn-chrono'), btnG = document.getElementById('btn-garden');
btnC.className = isChrono ? "px-8 py-3 rounded-full bg-white text-black" : "px-8 py-3 rounded-full text-white/30";
btnG.className = !isChrono ? "px-8 py-3 rounded-full bg-blue-600 text-white" : "px-8 py-3 rounded-full text-white/30";
if (!isChrono) renderGarden();
lucide.createIcons();
}
function updateChronoGrid() {
const now = new Date();
const today = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000) + 1;
const grid = document.getElementById('chrono-grid'); grid.innerHTML = '';
for (let i = 1; i <= 365; i++) {
const dot = document.createElement('div');
dot.className = `dot ${i < today ? 'dot-past' : (i === today ? 'dot-today' : 'dot-future')}`;
grid.appendChild(dot);
}
}
function renderGarden() {
const grid = document.getElementById('garden-grid'); grid.innerHTML = '';
for (let i = 1; i <= 365; i++) {
const dot = document.createElement('div');
dot.className = 'dot garden-empty';
grid.appendChild(dot);
}
}
function updateTicker() {
const now = new Date();
const start = new Date(now.getFullYear(), 0, 1).getTime();
const end = new Date(now.getFullYear() + 1, 0, 1).getTime();
const percent = ((now.getTime() - start) / (end - start)) * 100;
const daysLeft = 365 - Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
document.getElementById('percent-text').innerText = percent.toFixed(6) + '%';
document.getElementById('days-left-text').innerText = `${daysLeft}D LEFT`;
if (navigator.setAppBadge) navigator.setAppBadge(daysLeft);
}
function closeOverlay() { document.getElementById('immersive-overlay').classList.remove('active'); }
init(); setInterval(updateTicker, 100);
</script>
</body>
</html>
