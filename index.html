<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-CHRONO | Growth Engine</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Serif+Display:italic&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
--kb-red: #ef4444;
--kb-blue: #2563eb;
--paper: #e2e2e2;
--ink-chrono: #2563eb;
--ink-garden: #2563eb;
}
body {
background-color: #000000;
color: #FFFFFF;
font-family: 'Inter', sans-serif;
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
height: 100vh;
-webkit-font-smoothing: antialiased;
transition: background-color 0.4s ease, color 0.4s ease;
}
.font-serif { font-family: 'DM Serif Display', serif; }
.font-mono { font-family: 'JetBrains Mono', monospace; }
.dot-grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 10px; }
@media (min-width: 768px) { .dot-grid { grid-template-columns: repeat(25, 1fr); gap: 12px; } }
.dot { width: 6px; height: 6px; border-radius: 50%; transition: all 0.4s ease; cursor: pointer; }
/* CHRONO DOTS */
.dot-past { background-color: var(--kb-red); box-shadow: 0 0 8px rgba(239, 68, 68, 0.3); }
.dot-future { background-color: #1a1a1a; }
.dot-today { background-color: var(--ink-chrono); box-shadow: 0 0 15px var(--ink-chrono); animation: pulse 2s infinite; }
/* GARDEN DOTS */
.garden-dot-empty { background-color: #c4c4c4; opacity: 0.5; }
.dot-planted { width: 12px; height: 12px; display: flex; align-items: center; justify-content: center; transform: translateY(-2px); }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.7; } }
.morphy-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(40px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
.morphy-overlay.active { opacity: 1; pointer-events: auto; }
.morphy-card { position: relative; transform: scale(0.9); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); background: white; color: black; }
.morphy-overlay.active .morphy-card { transform: scale(1); }
.glass-pill { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
.garden-mode .glass-pill { background: rgba(0, 0, 0, 0.05); border: 1px solid rgba(0,0,0,0.05); }
.hide { display: none !important; }
.no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
<body id="main-body">
<!-- THEME PICKER (TOP RIGHT) -->
<button onclick="cycleTheme()" class="fixed top-8 right-8 z-50 p-3 rounded-full hover:rotate-90 transition-all duration-500 opacity-40 hover:opacity-100">
<i data-lucide="palette" id="theme-icon" class="w-5 h-5"></i>
</button>
<!-- ONBOARDING -->
<section id="onboarding" class="fixed inset-0 z-[200] bg-[#e2e2e2] flex items-center justify-center p-8 hide">
<div class="max-w-xs w-full space-y-8 text-center">
<h1 class="text-4xl font-serif italic text-blue-600">Who is planting these memories?</h1>
<input id="user-name-input" type="text" placeholder="Your Name" class="w-full bg-transparent border-b-2 border-blue-600 p-2 text-center text-xl outline-none font-bold text-blue-600">
<button onclick="saveIdentity()" class="bg-blue-600 text-white px-8 py-4 rounded-full text-[10px] font-black uppercase tracking-widest">Enter the Garden</button>
</div>
</section>
<div class="w-full max-w-sm md:max-w-xl flex flex-col items-center">
<!-- CHRONO VIEW -->
<div id="chrono-view" class="flex flex-col items-center w-full">
<header class="mb-12 text-center">
<h1 id="year-display" class="text-3xl font-serif text-white tracking-widest italic">2026</h1>
</header>
<div id="grid" class="dot-grid mb-16"></div>
<footer class="w-full flex flex-col items-center gap-2">
<div class="flex gap-4 text-[11px] font-black uppercase tracking-[0.3em] text-zinc-600 italic">
<span id="days-left-text">---D LEFT</span>
<span class="text-zinc-800">/</span>
<span id="percent-text" class="text-white font-mono tracking-tighter">0.000000%</span>
</div>
<p class="text-[8px] font-black text-zinc-800 uppercase tracking-[0.6em] mt-4">K-CHRONO FROM KODEBLOCK</p>
</footer>
</div>
<!-- GARDEN VIEW -->
<div id="garden-view" class="flex flex-col items-center w-full hide">
<header class="mb-12 text-center">
<h1 id="garden-title" class="text-3xl font-serif tracking-tight italic">Garden</h1>
</header>
<div id="garden-grid" class="dot-grid mb-16"></div>
<footer class="w-full flex flex-col items-center gap-2">
<p id="garden-stat-text" class="text-[9px] font-black uppercase tracking-[0.4em] opacity-40">365 days of growth</p>
<p class="text-[8px] font-black uppercase tracking-[0.6em] mt-4 opacity-20">PLANTING MEMORIES</p>
</footer>
</div>
<!-- SWITCHER PILL -->
<nav id="switcher" class="fixed bottom-10 glass-pill px-2 py-2 rounded-full flex gap-1 shadow-2xl z-50">
<button onclick="switchView('chrono')" id="btn-chrono" class="px-6 py-2 rounded-full transition-all duration-500 bg-white text-black shadow-lg">
<i data-lucide="clock" class="w-4 h-4"></i>
</button>
<button onclick="switchView('garden')" id="btn-garden" class="px-6 py-2 rounded-full transition-all duration-500 text-zinc-500">
<i data-lucide="flower" class="w-4 h-4"></i>
</button>
</nav>
</div>
<!-- POPUP COMPONENT -->
<div id="morphy-popup" class="morphy-overlay" onclick="closePopup()">
<div id="morphy-card-el" class="morphy-card max-w-sm w-full p-10 text-center rounded-[3rem] shadow-2xl" onclick="event.stopPropagation()">
<!-- Cancel X -->
<button onclick="closePopup()" class="absolute top-8 right-8 text-zinc-300 hover:text-zinc-800 transition-colors">
<i data-lucide="x" class="w-5 h-5"></i>
</button>
<div id="popup-dynamic-content" class="space-y-6">
<!-- Content injected here -->
</div>
</div>
</div>
<script>
const GREATS_QUOTES = [
"Your time is limited, so don't waste it living someone else's life. — Steve Jobs",
"It always seems impossible until it's done. — Nelson Mandela",
"He who is brave is free. — Seneca",
"The best way to predict the future is to create it. — Peter Drucker",
"Do what you can, with what you have, where you are. — Roosevelt",
"The soul becomes dyed with the color of its thoughts. — Marcus Aurelius",
"Excellence is not an act, but a habit. — Aristotle",
"Luck is what happens when preparation meets opportunity. — Seneca"
];
const THEME_COLORS = ['#2563eb', '#ef4444', '#22c55e', '#f59e0b', '#8b5cf6', '#ec4899'];
let chronoColorIdx = parseInt(localStorage.getItem('kchrono_color_idx')) || 0;
let gardenColorIdx = parseInt(localStorage.getItem('kgarden_color_idx')) || 0;
let username = localStorage.getItem('kchrono_user');
let memories = JSON.parse(localStorage.getItem('kchrono_memories')) || {};
let activeView = 'chrono';
function init() {
applyThemes();
updateGrid();
updateTicker();
lucide.createIcons();
if (!username && activeView === 'garden') document.getElementById('onboarding').classList.remove('hide');
}
function applyThemes() {
const chronoInk = THEME_COLORS[chronoColorIdx];
const gardenInk = THEME_COLORS[gardenColorIdx];
document.documentElement.style.setProperty('--ink-chrono', chronoInk);
document.documentElement.style.setProperty('--ink-garden', gardenInk);
if (activeView === 'chrono') {
document.getElementById('main-body').style.color = 'white';
document.getElementById('theme-icon').style.color = 'white';
} else {
document.getElementById('main-body').style.color = gardenInk;
document.getElementById('theme-icon').style.color = gardenInk;
}
}
function cycleTheme() {
if (activeView === 'chrono') {
chronoColorIdx = (chronoColorIdx + 1) % THEME_COLORS.length;
localStorage.setItem('kchrono_color_idx', chronoColorIdx);
} else {
gardenColorIdx = (gardenColorIdx + 1) % THEME_COLORS.length;
localStorage.setItem('kgarden_color_idx', gardenColorIdx);
}
applyThemes();
if (activeView === 'chrono') updateGrid(); else renderGardenGrid();
}
function switchView(view) {
activeView = view;
const body = document.getElementById('main-body');
const chrono = document.getElementById('chrono-view');
const garden = document.getElementById('garden-view');
const btnC = document.getElementById('btn-chrono');
const btnG = document.getElementById('btn-garden');
if (view === 'chrono') {
body.style.backgroundColor = "#000000";
chrono.classList.remove('hide');
garden.classList.add('hide');
body.classList.remove('garden-mode');
btnC.className = "px-6 py-2 rounded-full bg-white text-black shadow-lg";
btnG.className = "px-6 py-2 rounded-full text-zinc-500";
} else {
if (!username) return document.getElementById('onboarding').classList.remove('hide');
body.style.backgroundColor = "#e2e2e2";
chrono.classList.add('hide');
garden.classList.remove('hide');
body.classList.add('garden-mode');
document.getElementById('garden-title').innerText = `${username}'s Garden`;
const ink = THEME_COLORS[gardenColorIdx];
btnG.style.backgroundColor = ink;
btnG.className = "px-6 py-2 rounded-full text-white shadow-lg";
btnC.className = "px-6 py-2 rounded-full text-zinc-400";
renderGardenGrid();
}
applyThemes();
lucide.createIcons();
}
function saveIdentity() {
const name = document.getElementById('user-name-input').value;
if (name) {
localStorage.setItem('kchrono_user', name);
username = name;
document.getElementById('onboarding').classList.add('hide');
switchView('garden');
}
}
function getYearTotalDays() {
const year = new Date().getFullYear();
return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0) ? 366 : 365;
}
function getDayOfYear() {
const now = new Date();
const start = new Date(now.getFullYear(), 0, 0);
return Math.floor((now - start) / 86400000);
}
function updateGrid() {
const today = getDayOfYear();
const grid = document.getElementById('grid');
grid.innerHTML = '';
for (let i = 1; i <= getYearTotalDays(); i++) {
const dot = document.createElement('div');
dot.className = `dot ${i < today ? 'dot-past' : (i === today ? 'dot-today' : 'dot-future')}`;
dot.onclick = () => openPopup(i, today);
grid.appendChild(dot);
}
}
function renderGardenGrid() {
const grid = document.getElementById('garden-grid');
const total = getYearTotalDays();
document.getElementById('garden-stat-text').innerText = `${total} days of growth`;
grid.innerHTML = '';
for (let i = 1; i <= total; i++) {
const dot = document.createElement('div');
dot.className = 'dot';
if (memories[i]) {
dot.classList.add('dot-planted');
const color = memories[i].vibe === 'good' ? 'text-green-500' : (memories[i].vibe === 'bad' ? 'text-blue-500' : 'text-yellow-500');
dot.innerHTML = `<i data-lucide="flower" class="w-3 h-3 ${color}"></i>`;
} else {
dot.classList.add('garden-dot-empty');
}
dot.onclick = () => openJournal(i);
grid.appendChild(dot);
}
lucide.createIcons();
}
function openJournal(dayIndex) {
const content = document.getElementById('popup-dynamic-content');
const entry = memories[dayIndex];
const ink = THEME_COLORS[gardenColorIdx];
if (entry) {
content.innerHTML = `
<div class="text-left space-y-4 font-mono" style="color: ${ink}">
<p class="text-[9px] font-bold uppercase opacity-30 tracking-widest">${entry.stamp}</p>
<p class="text-lg leading-relaxed">${entry.text}</p>
</div>
`;
} else {
const dateStr = new Date(new Date().getFullYear(), 0, dayIndex).toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
content.innerHTML = `
<div class="text-left space-y-6">
<p class="text-[10px] font-black uppercase tracking-widest opacity-20">${dateStr}</p>
<textarea id="note-input" placeholder="Plant a memory..." class="w-full h-32 bg-transparent text-xl font-mono outline-none resize-none" style="color: ${ink}"></textarea>
<div class="flex justify-between items-end pt-4">
<div class="space-y-4">
<div class="flex items-center gap-3 cursor-pointer" onclick="window.currentVibe='good'">
<div class="w-4 h-4 rounded-full bg-green-500"></div><span class="text-[10px] font-bold uppercase tracking-widest opacity-40">Good</span>
</div>
<div class="flex items-center gap-3 cursor-pointer" onclick="window.currentVibe='neutral'">
<div class="w-4 h-4 rounded-full bg-yellow-400"></div><span class="text-[10px] font-bold uppercase tracking-widest opacity-40">Neutral</span>
</div>
<div class="flex items-center gap-3 cursor-pointer" onclick="window.currentVibe='bad'">
<div class="w-4 h-4 rounded-full bg-blue-500"></div><span class="text-[10px] font-bold uppercase tracking-widest opacity-40">Blue Day</span>
</div>
</div>
<button onclick="saveMemory(${dayIndex})" class="p-4 rounded-full bg-zinc-900 text-white shadow-xl hover:scale-110 transition-transform">
<i data-lucide="check" class="w-6 h-6"></i>
</button>
</div>
</div>
`;
window.currentVibe = 'good';
}
document.getElementById('morphy-popup').classList.add('active');
lucide.createIcons();
}
async function saveMemory(day) {
const text = document.getElementById('note-input').value;
if(!text) return;
const now = new Date();
const stamp = `${now.toLocaleDateString('en-US', {weekday:'long'})} • ${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
memories[day] = { text, vibe: window.currentVibe, stamp };
localStorage.setItem('kchrono_memories', JSON.stringify(memories));
closePopup();
renderGardenGrid();
}
function openPopup(index, today) {
if(activeView === 'garden') return;
const content = document.getElementById('popup-dynamic-content');
let msg = index < today ? "Nothing is behind, move forward." : (index === today ? GREATS_QUOTES[index % GREATS_QUOTES.length] : "Focus on the present now, the future will work itself if you put in the work.");
const accent = index < today ? '#ef4444' : (index === today ? THEME_COLORS[chronoColorIdx] : '#333');
content.innerHTML = `
<p class="text-xl md:text-2xl font-serif italic leading-relaxed text-zinc-800">${msg}</p>
<div class="mt-8 h-[1px] w-8 mx-auto" style="background-color: ${accent}"></div>
`;
document.getElementById('morphy-popup').classList.add('active');
}
function closePopup() { document.getElementById('morphy-popup').classList.remove('active'); }
function updateTicker() {
const now = new Date();
const year = now.getFullYear();
const total = getYearTotalDays();
const start = new Date(year, 0, 1).getTime();
const end = new Date(year + 1, 0, 1).getTime();
const percent = ((now.getTime() - start) / (end - start)) * 100;
const daysLeft = total - getDayOfYear();
document.getElementById('percent-text').innerText = percent.toFixed(6) + '%';
document.getElementById('days-left-text').innerText = `${daysLeft}D LEFT`;
}
init();
setInterval(updateTicker, 100);
setInterval(updateGrid, 3600000);
</script>
</body>
</html>
