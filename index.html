<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K-CHRONO | The Infrastructure</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Serif+Display:italic&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --kb-red: #ef4444; --kb-blue: #2563eb; }
body { font-family: 'Inter', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; -webkit-font-smoothing: antialiased; transition: background 0.6s cubic-bezier(0.16, 1, 0.3, 1); margin: 0; }
.font-serif { font-family: 'DM Serif Display', serif; }
.font-mono { font-family: 'JetBrains Mono', monospace; }
/* GRID LOGIC */
.dot-grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 10px; }
@media (min-width: 768px) { .dot-grid { grid-template-columns: repeat(25, 1fr); gap: 12px; } }
.dot { width: 6px; height: 6px; border-radius: 50%; transition: all 0.4s ease; cursor: pointer; }
/* CHRONO DOTS (FIXED) */
.dot-past { background-color: var(--kb-red); box-shadow: 0 0 8px rgba(239, 68, 68, 0.3); }
.dot-today { background-color: var(--kb-blue) !important; box-shadow: 0 0 15px var(--kb-blue); animation: pulse 2s infinite; }
.dot-future { background-color: #262626; } /* Visible on black */
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0.7; } }
/* FLOWER ICONS (SVG) */
.flower-svg { width: 14px; height: 14px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transform: translateY(-2px); }
/* OVERLAYS & MOBILE FIX */
.morphy-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(40px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: all 0.4s ease; }
.morphy-overlay.active { opacity: 1; pointer-events: auto; }
.morphy-card { background: white; color: black; position: relative; width: 90%; max-width: 360px; max-height: 80vh; overflow-y: auto; transform: scale(0.9); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); border-radius: 3rem; padding: 2.5rem; }
.morphy-overlay.active .morphy-card { transform: scale(1); }
.theme-bar { position: fixed; top: 80px; right: 24px; display: flex; flex-direction: column; gap: 12px; opacity: 0; transform: translateX(20px); pointer-events: none; transition: all 0.4s ease; }
.theme-bar.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
.sentiment-btn { transition: all 0.2s ease; border: 2px solid transparent; padding: 10px; border-radius: 1rem; width: 100%; text-align: left; }
.sentiment-btn.selected { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.1); }
.glass-pill { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
.hide { display: none !important; }
</style>
</head>
<body id="main-body">
<!-- THEME PICKER -->
<button onclick="toggleThemePicker()" class="fixed top-6 right-6 z-[110] p-3 opacity-40 hover:opacity-100 transition-opacity">
<i data-lucide="palette" id="palette-icon" class="w-6 h-6"></i>
</button>
<div id="theme-bar" class="theme-bar z-[110]">
<div onclick="setPageColor('#000000')" class="w-8 h-8 rounded-full bg-black border border-white/20 cursor-pointer shadow-xl"></div>
<div onclick="setPageColor('#e2e2e2')" class="w-8 h-8 rounded-full bg-[#e2e2e2] border border-black/10 cursor-pointer shadow-xl"></div>
<div onclick="setPageColor('#111827')" class="w-8 h-8 rounded-full bg-[#111827] border border-white/10 cursor-pointer shadow-xl"></div>
<div onclick="setPageColor('#ecfdf5')" class="w-8 h-8 rounded-full bg-[#ecfdf5] border border-black/5 cursor-pointer shadow-xl"></div>
</div>
<!-- ONBOARDING -->
<section id="onboarding" class="fixed inset-0 z-[200] bg-[#e2e2e2] flex items-center justify-center p-8 hide">
<div class="max-w-xs w-full space-y-8 text-center text-blue-600">
<h1 class="text-4xl font-serif italic">Who is planting these memories?</h1>
<input id="user-name-input" type="text" placeholder="Your Name" class="w-full bg-transparent border-b-2 border-blue-600 p-2 text-center text-xl outline-none font-bold">
<button onclick="saveIdentity()" class="bg-blue-600 text-white px-10 py-4 rounded-full text-[10px] font-black uppercase tracking-widest shadow-xl">Begin</button>
</div>
</section>
<div class="w-full max-w-sm md:max-w-xl flex flex-col items-center">
<!-- CHRONO -->
<div id="chrono-view" class="flex flex-col items-center w-full">
<header class="mb-10 text-center">
<h1 class="text-3xl font-serif tracking-widest italic text-white">2026</h1>
</header>
<div id="grid" class="dot-grid mb-14"></div>
<footer class="flex flex-col items-center gap-2">
<div class="flex gap-4 text-[10px] font-black uppercase tracking-[0.3em] opacity-40 italic text-white">
<span id="days-left-text">---D LEFT</span>
<span>/</span>
<span id="percent-text" class="font-mono">0.000000%</span>
</div>
<p class="text-[7px] font-black uppercase tracking-[0.5em] mt-4 opacity-20 text-white">K-CHRONO FROM KODEBLOCK</p>
</footer>
</div>
<!-- GARDEN -->
<div id="garden-view" class="flex flex-col items-center w-full hide">
<header class="mb-10 text-center">
<h1 id="garden-title" class="text-3xl font-serif tracking-tight italic">Garden</h1>
</header>
<div id="garden-grid" class="dot-grid mb-14"></div>
<footer class="flex flex-col items-center gap-2">
<p id="garden-stat-text" class="text-[9px] font-black uppercase tracking-[0.4em] opacity-40">365 days of growth</p>
<p class="text-[7px] font-black uppercase tracking-[0.6em] mt-4 opacity-10">PLANTING MEMORIES</p>
</footer>
</div>
<!-- NAV PILL -->
<nav class="fixed bottom-8 glass-pill p-1.5 rounded-full flex gap-1 shadow-2xl z-50">
<button onclick="switchView('chrono')" id="btn-chrono" class="px-7 py-2.5 rounded-full transition-all duration-500 bg-white text-black shadow-lg">
<i data-lucide="clock" class="w-4 h-4"></i>
</button>
<button onclick="switchView('garden')" id="btn-garden" class="px-7 py-2.5 rounded-full transition-all duration-500 text-white/40">
<i data-lucide="flower" class="w-4 h-4"></i>
</button>
</nav>
</div>
<!-- POPUP -->
<div id="morphy-popup" class="morphy-overlay" onclick="closePopup()">
<div id="morphy-card-el" class="morphy-card shadow-2xl" onclick="event.stopPropagation()">
<button onclick="closePopup()" class="absolute top-6 right-6 text-zinc-300 hover:text-black transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
<div id="popup-dynamic-content" class="space-y-6"></div>
</div>
</div>
<script>
// HAND-DRAWN FLOWER ASSETS
const FLOWER_SVGS = {
good: `<svg class="flower-svg stroke-green-500" viewBox="0 0 24 24"><path d="M12 22c0-4 3-7 3-10S12 2 12 2s-3 7-3 10 3 6 3 10M7 12c0 2 2 4 5 4s5-2 5-4-2-4-5-4-5 2-5 4z"/></svg>`,
neutral: `<svg class="flower-svg stroke-yellow-500" viewBox="0 0 24 24"><path d="M12 22V12M12 12c2-2 4-2 4-4s-2-2-4 0M12 12c-2-2-4-2-4-4s2-2 4 0M12 15c2 0 3-1 3-3s-1-3-3-3-3 1-3 3 1 3 3 3z"/></svg>`,
bad: `<svg class="flower-svg stroke-blue-500" viewBox="0 0 24 24"><path d="M12 22s-1-4-4-6-4-4-4-4 4 1 6 4 6-4 6-4-1 2-4 4-4 6-4 6z"/></svg>`
};
const GREATS_QUOTES = [
"Your time is limited, so don't waste it living someone else's life. — Steve Jobs",
"It always seems impossible until it's done. — Nelson Mandela",
"He who is brave is free. — Seneca",
"The best way to predict the future is to create it. — Peter Drucker",
"Do what you can, with what you have, where you are. — Roosevelt",
"The soul becomes dyed with the color of its thoughts. — Marcus Aurelius",
"Excellence is not an act, but a habit. — Aristotle",
"Luck is preparation meeting opportunity. — Seneca"
];
let username = localStorage.getItem('kchrono_user');
let memories = JSON.parse(localStorage.getItem('kchrono_memories')) || {};
let chronoBG = localStorage.getItem('kchrono_bg') || '#000000';
let gardenBG = localStorage.getItem('kgarden_bg') || '#e2e2e2';
let activeView = 'chrono';
let selectedVibe = 'good';
function init() {
setPageColor(activeView === 'chrono' ? chronoBG : gardenBG, true);
updateGrid();
updateTicker();
if (!username && activeView === 'garden') document.getElementById('onboarding').classList.remove('hide');
lucide.createIcons();
}
function toggleThemePicker() { document.getElementById('theme-bar').classList.toggle('active'); }
function setPageColor(color, isInit = false) {
document.getElementById('main-body').style.backgroundColor = color;
const isDark = isColorDark(color);
const ink = isDark ? 'white' : '#2563eb';
document.getElementById('main-body').style.color = ink;
document.getElementById('palette-icon').style.color = ink;
if (!isInit) {
if (activeView === 'chrono') { chronoBG = color; localStorage.setItem('kchrono_bg', color); }
else { gardenBG = color; localStorage.setItem('kgarden_bg', color); }
}
if (activeView === 'garden') renderGardenGrid();
else updateGrid();
}
function isColorDark(color) {
const c = color.substring(1);
const rgb = parseInt(c, 16);
const r = (rgb >> 16) & 0xff, g = (rgb >> 8) & 0xff, b = (rgb >> 0) & 0xff;
return (0.2126 * r + 0.7152 * g + 0.0722 * b) < 120;
}
function switchView(view) {
activeView = view;
const isChrono = view === 'chrono';
document.getElementById('chrono-view').classList.toggle('hide', !isChrono);
document.getElementById('garden-view').classList.toggle('hide', isChrono);
if (!isChrono && !username) document.getElementById('onboarding').classList.remove('hide');
setPageColor(isChrono ? chronoBG : gardenBG, true);
const btnC = document.getElementById('btn-chrono'), btnG = document.getElementById('btn-garden');
if (isChrono) {
btnC.className = "px-7 py-2.5 rounded-full bg-white text-black shadow-lg";
btnG.className = "px-7 py-2.5 rounded-full text-white/40";
} else {
document.getElementById('garden-title').innerText = `${username}'s Garden`;
const ink = !isColorDark(gardenBG) ? '#2563eb' : 'white';
btnG.style.backgroundColor = ink;
btnG.className = `px-7 py-2.5 rounded-full ${isColorDark(ink) ? 'text-white' : 'text-white'} shadow-lg`;
btnC.className = "px-7 py-2.5 rounded-full text-black/20";
renderGardenGrid();
}
lucide.createIcons();
}
function saveIdentity() {
const name = document.getElementById('user-name-input').value;
if (name) { localStorage.setItem('kchrono_user', name); username = name; document.getElementById('onboarding').classList.add('hide'); switchView('garden'); }
}
function getDayOfYear() {
const now = new Date();
const start = new Date(now.getFullYear(), 0, 0);
return Math.floor((now - start) / 86400000);
}
function getYearDays() { const y = new Date().getFullYear(); return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0) ? 366 : 365; }
function updateGrid() {
const today = getDayOfYear();
const grid = document.getElementById('grid');
grid.innerHTML = '';
for (let i = 1; i <= getYearDays(); i++) {
const dot = document.createElement('div');
dot.className = `dot ${i < today ? 'dot-past' : (i === today ? 'dot-today' : 'dot-future')}`;
dot.onclick = () => openPopup(i, today);
grid.appendChild(dot);
}
}
function renderGardenGrid() {
const grid = document.getElementById('garden-grid');
grid.innerHTML = '';
for (let i = 1; i <= getYearDays(); i++) {
const dot = document.createElement('div');
dot.className = 'dot';
if (memories[i]) {
dot.classList.add('dot-planted');
dot.innerHTML = FLOWER_SVGS[memories[i].vibe];
} else {
dot.classList.add('garden-dot-empty');
}
dot.onclick = () => openJournal(i);
grid.appendChild(dot);
}
}
function selectVibe(vibe, el) {
selectedVibe = vibe;
document.querySelectorAll('.sentiment-btn').forEach(b => b.classList.remove('selected'));
el.classList.add('selected');
}
function openJournal(dayIndex) {
const content = document.getElementById('popup-dynamic-content');
const entry = memories[dayIndex];
if (entry) {
content.innerHTML = `<div class="text-left space-y-4 font-mono text-zinc-900"><p class="text-[9px] font-bold uppercase opacity-30 tracking-widest">${entry.stamp}</p><p class="text-lg leading-relaxed">${entry.text}</p></div>`;
} else {
const dateStr = new Date(new Date().getFullYear(), 0, dayIndex).toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
content.innerHTML = `
<div class="text-left space-y-6">
<p class="text-[10px] font-black uppercase tracking-widest opacity-20 text-zinc-400">${dateStr}</p>
<textarea id="note-input" placeholder="Plant a memory..." class="w-full h-32 bg-transparent text-xl font-mono outline-none resize-none text-zinc-900"></textarea>
<div class="flex flex-col gap-4">
<div class="grid grid-cols-1 gap-2">
<div onclick="selectVibe('good', this)" class="sentiment-btn selected flex items-center gap-3 cursor-pointer"><div class="w-4 h-4 rounded-full bg-green-500"></div><span class="text-[10px] font-bold uppercase tracking-widest opacity-60">Good</span></div>
<div onclick="selectVibe('neutral', this)" class="sentiment-btn flex items-center gap-3 cursor-pointer"><div class="w-4 h-4 rounded-full bg-yellow-400"></div><span class="text-[10px] font-bold uppercase tracking-widest opacity-60">Neutral</span></div>
<div onclick="selectVibe('bad', this)" class="sentiment-btn flex items-center gap-3 cursor-pointer"><div class="w-4 h-4 rounded-full bg-blue-500"></div><span class="text-[10px] font-bold uppercase tracking-widest opacity-60">Blue Day</span></div>
</div>
<div class="flex justify-end pt-2">
<button onclick="saveMemory(${dayIndex})" class="w-16 h-16 rounded-full bg-black text-white flex items-center justify-center shadow-2xl active:scale-90 transition-transform"><i data-lucide="check" class="w-8 h-8"></i></button>
</div>
</div>
</div>`;
selectedVibe = 'good';
}
document.getElementById('morphy-popup').classList.add('active');
lucide.createIcons();
}
async function saveMemory(day) {
const text = document.getElementById('note-input').value;
if(!text) return;
const now = new Date();
const stamp = `${now.toLocaleDateString('en-US', {weekday:'long'})} • ${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
memories[day] = { text, vibe: selectedVibe, stamp };
localStorage.setItem('kchrono_memories', JSON.stringify(memories));
closePopup(); renderGardenGrid();
}
function openPopup(index, today) {
if(activeView === 'garden') return;
const content = document.getElementById('popup-dynamic-content');
let msg = index < today ? "Nothing is behind, move forward." : (index === today ? GREATS_QUOTES[index % GREATS_QUOTES.length] : "Focus on the present now.");
content.innerHTML = `<p class="text-xl md:text-2xl font-serif italic leading-relaxed text-zinc-800">${msg}</p><div class="mt-8 h-[1px] w-8 mx-auto" style="background: ${index < today ? '#ef4444' : '#2563eb'}"></div>`;
document.getElementById('morphy-popup').classList.add('active');
}
function closePopup() { document.getElementById('morphy-popup').classList.remove('active'); }
function updateTicker() {
const now = new Date(); const year = now.getFullYear(); const total = getYearDays();
const start = new Date(year, 0, 1).getTime(); const end = new Date(year + 1, 0, 1).getTime();
const percent = ((now.getTime() - start) / (end - start)) * 100;
document.getElementById('percent-text').innerText = percent.toFixed(6) + '%';
document.getElementById('days-left-text').innerText = `${total - getDayOfYear()}D LEFT`;
}
init();
setInterval(updateTicker, 100);
</script>
</body>
</html>
