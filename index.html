<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K-CHRONO | The Infrastructure</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Serif+Display:italic&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --kb-red: #ef4444; --kb-blue: #2563eb; }
body { background-color: #000000; color: #FFFFFF; font-family: 'Inter', sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; -webkit-font-smoothing: antialiased; transition: background-color 0.4s ease; margin: 0; }
.font-serif { font-family: 'DM Serif Display', serif; }
.font-mono { font-family: 'JetBrains Mono', monospace; }
.dot-grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 10px; }
@media (min-width: 768px) { .dot-grid { grid-template-columns: repeat(25, 1fr); gap: 12px; } }
.dot { width: 6px; height: 6px; border-radius: 50%; transition: all 0.3s ease; cursor: pointer; }
/* CHRONO DOTS */
.dot-past { background-color: var(--kb-red); box-shadow: 0 0 8px rgba(239, 68, 68, 0.3); }
.dot-today { background-color: var(--kb-blue) !important; box-shadow: 0 0 15px var(--kb-blue); animation: pulse 2s infinite; }
.dot-future { background-color: #1a1a1a; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.5); } }
/* POPUP & CARD (STRICT BLACK FOR CHRONO) */
.morphy-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(40px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
.morphy-overlay.active { opacity: 1; pointer-events: auto; }
.morphy-card { position: relative; width: 85%; max-width: 340px; border-radius: 2.5rem; padding: 2rem; transform: scale(0.9); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
.morphy-overlay.active .morphy-card { transform: scale(1); }
/* THEME PICKER */
.theme-bar { position: fixed; top: 70px; right: 24px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transform: translateX(10px); pointer-events: none; transition: all 0.3s ease; z-index: 110; }
.theme-bar.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
.sentiment-choice { transition: all 0.2s ease; border: 2px solid transparent; }
.sentiment-choice.selected { transform: scale(1.2); border-color: currentColor; }
.glass-pill { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
.hide { display: none !important; }
</style>
</head>
<body id="main-body">
<!-- PALETTE -->
<button onclick="toggleThemePicker()" class="fixed top-6 right-6 z-[120] p-3 opacity-30 hover:opacity-100 transition-opacity">
<i data-lucide="palette" id="palette-icon" class="w-6 h-6"></i>
</button>
<div id="theme-bar" class="theme-bar">
<div onclick="setPageColor('#000000')" class="w-7 h-7 rounded-full bg-black border border-white/20 cursor-pointer"></div>
<div onclick="setPageColor('#e2e2e2')" class="w-7 h-7 rounded-full bg-[#e2e2e2] border border-black/10 cursor-pointer"></div>
<div onclick="setPageColor('#111827')" class="w-7 h-7 rounded-full bg-[#111827] border border-white/10 cursor-pointer"></div>
<div onclick="setPageColor('#064e3b')" class="w-7 h-7 rounded-full bg-[#064e3b] border border-white/10 cursor-pointer"></div>
</div>
<!-- ONBOARDING -->
<section id="onboarding" class="fixed inset-0 z-[200] bg-[#e2e2e2] flex items-center justify-center p-8 hide text-blue-600">
<div class="max-w-xs w-full space-y-8 text-center">
<h1 class="text-4xl font-serif italic">Who is planting these memories?</h1>
<input id="user-name-input" type="text" placeholder="Your Name" class="w-full bg-transparent border-b-2 border-blue-600 p-2 text-center text-xl outline-none font-bold">
<button onclick="saveIdentity()" class="bg-blue-600 text-white px-10 py-4 rounded-full text-[10px] font-black uppercase tracking-widest">Enter</button>
</div>
</section>
<div class="w-full max-w-sm md:max-w-xl flex flex-col items-center">
<!-- CHRONO VIEW -->
<div id="chrono-view" class="flex flex-col items-center w-full">
<header class="mb-10 text-center">
<h1 class="text-3xl font-serif tracking-widest italic">2026</h1>
</header>
<div id="grid" class="dot-grid mb-14"></div>
<footer class="flex flex-col items-center gap-2">
<div class="flex gap-4 text-[10px] font-black uppercase tracking-[0.3em] opacity-40 italic">
<span id="days-left-text">---D LEFT</span>
<span>/</span>
<span id="percent-text" class="font-mono">0.000000%</span>
</div>
<p class="text-[7px] font-black uppercase tracking-[0.5em] mt-4 opacity-20">K-CHRONO FROM KODEBLOCK</p>
</footer>
</div>
<!-- GARDEN VIEW -->
<div id="garden-view" class="flex flex-col items-center w-full hide">
<header class="mb-10 text-center">
<h1 id="garden-title" class="text-3xl font-serif tracking-tight italic">Garden</h1>
</header>
<div id="garden-grid" class="dot-grid mb-14"></div>
<footer class="flex flex-col items-center gap-2">
<p id="garden-stat-text" class="text-[9px] font-black uppercase tracking-[0.4em] opacity-30">365 days of growth</p>
<p class="text-[7px] font-black uppercase tracking-[0.6em] mt-4 opacity-10">PLANTING MEMORIES</p>
</footer>
</div>
<!-- NAV PILL -->
<nav class="fixed bottom-8 glass-pill p-1.5 rounded-full flex gap-1 shadow-2xl z-50">
<button onclick="switchView('chrono')" id="btn-chrono" class="px-7 py-2.5 rounded-full transition-all duration-500 bg-white text-black shadow-lg">
<i data-lucide="clock" class="w-4 h-4"></i>
</button>
<button onclick="switchView('garden')" id="btn-garden" class="px-7 py-2.5 rounded-full transition-all duration-500 text-white/30">
<i data-lucide="flower" class="w-4 h-4"></i>
</button>
</nav>
</div>
<!-- POPUP -->
<div id="morphy-popup" class="morphy-overlay" onclick="closePopup()">
<div id="morphy-card-el" class="morphy-card shadow-2xl" onclick="event.stopPropagation()">
<button onclick="closePopup()" class="absolute top-6 right-6 opacity-30 hover:opacity-100"><i data-lucide="x" class="w-5 h-5"></i></button>
<div id="popup-dynamic-content" class="space-y-6"></div>
</div>
</div>
<script>
const GREATS_QUOTES = [
"Your time is limited, so don't waste it living someone else's life. — Steve Jobs",
"It always seems impossible until it's done. — Nelson Mandela",
"He who is brave is free. — Seneca",
"The best way to predict the future is to create it. — Peter Drucker",
"Do what you can, with what you have, where you are. — Roosevelt",
"The soul becomes dyed with the color of its thoughts. — Marcus Aurelius",
"Excellence is not an act, but a habit. — Aristotle",
"Luck is preparation meeting opportunity. — Seneca"
];
let username = localStorage.getItem('kchrono_user');
let memories = JSON.parse(localStorage.getItem('kchrono_memories')) || {};
let chronoBG = localStorage.getItem('kchrono_bg') || '#000000';
let gardenBG = localStorage.getItem('kgarden_bg') || '#e2e2e2';
let activeView = 'chrono';
let selectedVibe = 'good';
function init() {
setPageColor(activeView === 'chrono' ? chronoBG : gardenBG, true);
updateGrid();
updateTicker();
lucide.createIcons();
if (!username && activeView === 'garden') document.getElementById('onboarding').classList.remove('hide');
}
function toggleThemePicker() { document.getElementById('theme-bar').classList.toggle('active'); }
function setPageColor(color, isInit = false) {
const body = document.getElementById('main-body');
body.style.backgroundColor = color;
const isDark = isColorDark(color);
body.style.color = isDark ? 'white' : '#2563eb';
document.getElementById('palette-icon').style.color = isDark ? 'white' : '#2563eb';
if (!isInit) {
if (activeView === 'chrono') { chronoBG = color; localStorage.setItem('kchrono_bg', color); }
else { gardenBG = color; localStorage.setItem('kgarden_bg', color); }
}
if (activeView === 'garden') renderGardenGrid(); else updateGrid();
}
function isColorDark(color) {
const c = color.substring(1);
const rgb = parseInt(c, 16);
const r = (rgb >> 16) & 0xff, g = (rgb >> 8) & 0xff, b = (rgb >> 0) & 0xff;
return (0.2126 * r + 0.7152 * g + 0.0722 * b) < 120;
}
function switchView(view) {
activeView = view;
const isChrono = view === 'chrono';
document.getElementById('chrono-view').classList.toggle('hide', !isChrono);
document.getElementById('garden-view').classList.toggle('hide', isChrono);
if (!isChrono && !username) document.getElementById('onboarding').classList.remove('hide');
setPageColor(isChrono ? chronoBG : gardenBG, true);
const btnC = document.getElementById('btn-chrono'), btnG = document.getElementById('btn-garden');
if (isChrono) {
btnC.className = "px-7 py-2.5 rounded-full bg-white text-black shadow-lg";
btnG.className = "px-7 py-2.5 rounded-full text-white/30";
} else {
document.getElementById('garden-title').innerText = `${username}'s Garden`;
btnG.className = "px-7 py-2.5 rounded-full bg-blue-600 text-white shadow-lg";
btnC.className = "px-7 py-2.5 rounded-full text-black/10";
renderGardenGrid();
}
lucide.createIcons();
}
function saveIdentity() {
const n = document.getElementById('user-name-input').value;
if (n) { localStorage.setItem('kchrono_user', n); username = n; document.getElementById('onboarding').classList.add('hide'); switchView('garden'); }
}
function getDayOfYear() { return Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000); }
function getYearTotal() { const y = new Date().getFullYear(); return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0) ? 366 : 365; }
function updateGrid() {
const today = getDayOfYear(); const grid = document.getElementById('grid'); grid.innerHTML = '';
for (let i = 1; i <= getYearTotal(); i++) {
const dot = document.createElement('div');
dot.className = `dot ${i < today ? 'dot-past' : (i === today ? 'dot-today' : 'dot-future')}`;
dot.onclick = () => openPopup(i, today);
grid.appendChild(dot);
}
}
function renderGardenGrid() {
const grid = document.getElementById('garden-grid'); grid.innerHTML = '';
for (let i = 1; i <= getYearTotal(); i++) {
const dot = document.createElement('div');
dot.className = 'dot';
if (memories[i]) {
const color = memories[i].vibe === 'good' ? '#22c55e' : (memories[i].vibe === 'bad' ? '#2563eb' : '#eab308');
dot.style.backgroundColor = color;
dot.style.boxShadow = `0 0 5px ${color}`;
} else { dot.style.backgroundColor = '#c4c4c4'; dot.style.opacity = '0.4'; }
dot.onclick = () => openJournal(i);
grid.appendChild(dot);
}
}
function setVibe(v, el) {
selectedVibe = v;
document.querySelectorAll('.sentiment-choice').forEach(b => b.classList.remove('selected'));
el.classList.add('selected');
}
function openJournal(day) {
const content = document.getElementById('popup-dynamic-content');
const card = document.getElementById('morphy-card-el');
const entry = memories[day];
card.style.backgroundColor = "white";
card.style.color = "black";
if (entry) {
content.innerHTML = `<div class="text-left space-y-4 font-mono"><p class="text-[9px] font-bold uppercase opacity-30">${entry.stamp}</p><p class="text-lg leading-relaxed text-zinc-800">${entry.text}</p></div>`;
} else {
const dateStr = new Date(new Date().getFullYear(), 0, day).toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
content.innerHTML = `
<div class="text-left space-y-6">
<p class="text-[10px] font-black uppercase tracking-widest opacity-20">${dateStr}</p>
<textarea id="note-input" placeholder="Plant a memory..." class="w-full h-32 bg-transparent text-xl font-mono outline-none resize-none"></textarea>
<div class="flex justify-between items-end">
<div class="space-y-3">
<div onclick="setVibe('good', this)" class="sentiment-choice selected flex items-center gap-3 cursor-pointer"><div class="w-4 h-4 rounded-full bg-green-500"></div><span class="text-[9px] font-black opacity-40">GOOD</span></div>
<div onclick="setVibe('neutral', this)" class="sentiment-choice flex items-center gap-3 cursor-pointer"><div class="w-4 h-4 rounded-full bg-yellow-400"></div><span class="text-[9px] font-black opacity-40">NEUTRAL</span></div>
<div onclick="setVibe('bad', this)" class="sentiment-choice flex items-center gap-3 cursor-pointer"><div class="w-4 h-4 rounded-full bg-blue-500"></div><span class="text-[9px] font-black opacity-40">BLUE DAY</span></div>
</div>
<button onclick="saveMemory(${day})" class="w-16 h-16 rounded-full bg-black text-white flex items-center justify-center shadow-2xl active:scale-95 transition-transform"><i data-lucide="check" class="w-8 h-8"></i></button>
</div>
</div>`;
selectedVibe = 'good';
}
document.getElementById('morphy-popup').classList.add('active');
lucide.createIcons();
}
async function saveMemory(day) {
const txt = document.getElementById('note-input').value; if(!txt) return;
const now = new Date();
const stamp = `${now.toLocaleDateString('en-US', {weekday:'long'})} • ${now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
memories[day] = { text: txt, vibe: selectedVibe, stamp };
localStorage.setItem('kchrono_memories', JSON.stringify(memories));
closePopup(); renderGardenGrid();
}
function openPopup(index, today) {
if(activeView === 'garden') return;
const content = document.getElementById('popup-dynamic-content');
const card = document.getElementById('morphy-card-el');
let msg = index < today ? "Nothing is behind, move forward." : (index === today ? GREATS_QUOTES[index % GREATS_QUOTES.length] : "Focus on the present now.");
card.style.backgroundColor = "black";
card.style.color = "white";
content.innerHTML = `<p class="text-xl md:text-2xl font-serif italic leading-relaxed">${msg}</p><div class="mt-8 h-[1px] w-8 mx-auto" style="background: ${index < today ? '#ef4444' : '#2563eb'}"></div>`;
document.getElementById('morphy-popup').classList.add('active');
}
function closePopup() { document.getElementById('morphy-popup').classList.remove('active'); }
function updateTicker() {
const now = new Date(); const total = getYearTotal();
const start = new Date(now.getFullYear(), 0, 1).getTime();
const end = new Date(now.getFullYear() + 1, 0, 1).getTime();
const percent = ((now.getTime() - start) / (end - start)) * 100;
document.getElementById('percent-text').innerText = percent.toFixed(6) + '%';
document.getElementById('days-left-text').innerText = `${total - getDayOfYear()}D LEFT`;
}
init();
setInterval(updateTicker, 100);
</script>
</body>
</html>
